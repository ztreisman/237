<style>
*{box-sizing:border-box;margin:0;padding:0;}

.ctrl label{min-width:82px;}

#resetlb{font-size:10px;padding:2px 7px;margin-top:4px;width:100%;}

function proj([x,y,z]){
  const cx=Math.cos(rotX),sx=Math.sin(rotX),cy=Math.cos(rotY),sy=Math.sin(rotY);
  const x2=cy*x+sy*z,z2=-sy*x+cy*z,y2=cx*y-sx*z2,z3=sx*y+cx*z2;
  return[W/2+x2*zoom,H/2-y2*zoom,z3];
}

function buildS(pts){
  const s=[0];
  for(let i=1;i<pts.length;i++){
    const[a,b,c]=pts[i],[d,e,f]=pts[i-1];
    s.push(s[s.length-1]+Math.sqrt((a-d)**2+(b-e)**2+(c-f)**2));
  }
  return{s,total:s[s.length-1]};
}
function interp(arr,p,t){
  const n=arr.length,tgt=((t%1)+1)%1*p.total;
  let lo=0,hi=n-1;
  while(lo<hi-1){const m=(lo+hi)>>1;p.s[m]<=tgt?lo=m:hi=m;}
  const f=(tgt-p.s[lo])/(p.s[hi]-p.s[lo]||1);
  if(Array.isArray(arr[lo]))return arr[lo].map((v,i)=>v+(arr[hi][i]-v)*f);
  return arr[lo]+(arr[hi]-arr[lo])*f;
}

// Box-Muller normal sample
function randn(mu,sd){
  const u=1-Math.random(),v=Math.random();
  return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

// Precompute per-vertex radius along each track (for awareness)
function trackRadii(track){
  // Each point's distance from origin (already centred)
  return track.map(p=>Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2]));
}

const R5_RAD_MEAN=R5_RAD.reduce((a,b)=>a+b)/R5_RAD.length;

// Get local speed factor for a racer at position t on a track
// Awareness: far-out (large radius) = faster, close-in = slower
function localSpeedFactor(t,radArr,radMean){
  if(awareness<0.001)return 1.0;
  const n=radArr.length;
  const tgt=((t%1)+1)%1*(n-1);
  const lo=Math.floor(tgt),hi=Math.min(lo+1,n-1);
  const r=radArr[lo]+(radArr[hi]-radArr[lo])*(tgt-lo);
  // normalize: r/mean, then blend with 1 by awareness
  const factor=r/radMean;
  return 1.0+awareness*(factor-1.0);
}

function checkCross(k,newT,oldT,ts){

function precompFaces(verts, faces, faceRings){
  return faces.map((f,i)=>{
    const vs=f.map(vi=>verts[vi]);
    const cx=(vs[0][0]+vs[1][0]+vs[2][0])/3;
    const cy=(vs[0][1]+vs[1][1]+vs[2][1])/3;
    const cz=(vs[0][2]+vs[1][2]+vs[2][2])/3;
    const r=faceRings[i];
    return{f,cx,cy,cz,r};
  });
}

function drawSurface(verts, precomp, alpha){
  // Project all verts
  const pv=verts.map(v=>proj(v));
  // Sort faces by projected z (painter's algorithm)
  const sorted=[...precomp].sort((a,b)=>{
    const za=pv[a.f[0]][2]+pv[a.f[1]][2]+pv[a.f[2]][2];
    const zb=pv[b.f[0]][2]+pv[b.f[1]][2]+pv[b.f[2]][2];
    return za-zb;
  });
  for(const{f,r} of sorted){
    const [p0,p1,p2]=[pv[f[0]],pv[f[1]],pv[f[2]]];
    const col=VIR[Math.min(r,VIR.length-1)];
    const avgZ=(p0[2]+p1[2]+p2[2])/3;
    const depth=Math.max(0,(avgZ+1.5)/3);
    const a=alpha*depth;
    ctx.beginPath();
    ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);
    ctx.closePath();
    ctx.fillStyle=`rgba(${Math.round(col[0]*255)},${Math.round(col[1]*255)},${Math.round(col[2]*255)},${a.toFixed(3)})`;
    ctx.fill();
    ctx.strokeStyle=`rgba(${Math.round(col[0]*255)},${Math.round(col[1]*255)},${Math.round(col[2]*255)},0.15)`;
    ctx.lineWidth=0.3;ctx.stroke();
  }
}

// Per-ring phase offset: each ring's vertex list starts at a different angle.

const RING_PHASE_OFFSET=(function(){

function pdPos(t,r){

function drawGeodesic(gctx,z1,z2,color,lineW){
  const x1=PDCX+z1[0]*PDR, y1=PDCY-z1[1]*PDR;
  const x2=PDCX+z2[0]*PDR, y2=PDCY-z2[1]*PDR;

function drawPDisk(){

      g.addColorStop(1,'rgba('+rc+','+gc+','+bc+',0)');
