// Arc-length interpolation on a track
function interpTrack(ring, t) {
  const pts = TRACKS[ring];
  const par = PARAMS[ring];
  const n   = pts.length;
  const tgt = ((t%1)+1)%1;
  let lo=0, hi=n-1;
  while(lo<hi-1) { const m=(lo+hi)>>1; par[m]<=tgt?lo=m:hi=m; }
  const f = (tgt-par[lo])/(par[hi]-par[lo]||1);
  return pts[lo].map((v,i)=>v+(pts[hi][i]-v)*f);
}

// Given t on ring r, find corresponding t on ring r+1 via link map
function linkedT(r, t) {
  const lm = LINKS[String(r)];
  if(!lm || !lm.length) return t;
  // lm is sorted by t_r; find bracket and interpolate t_r1
  const tgt = ((t%1)+1)%1;
  let lo=0, hi=lm.length-1;
  // handle wrap-around: append first entry shifted by 1
  const extended = [...lm, [lm[0][0]+1, lm[0][1]+1]];
  for(let i=0;i<extended.length-1;i++) {
    const [t0,s0]=extended[i], [t1,s1]=extended[i+1];
    if(tgt>=t0 && tgt<t1) {
      const f=(tgt-t0)/(t1-t0);
      return ((s0+f*(s1-s0))%1+1)%1;
    }
  }
  return tgt;
}

}
function setN(n) { N=n; document.getElementById('nv').textContent=n; trails=[]; }
function setTrail(v) { TRAIL_LEN=v; document.getElementById('trailv').textContent=v; }
function togglePause() { paused=!paused; document.getElementById('pbtn').textContent=paused?'▶ Play':'⏸ Pause'; }
function resetView()   { rotX=0.35; rotY=0.25; zoom=baseZoom(); }
function toggleSurface() { showSurface=!showSurface; document.getElementById('surfbtn').classList.toggle('on',showSurface); }
function toggleTracks()  { showTracks=!showTracks;   document.getElementById('trkbtn').classList.toggle('on',showTracks); }
function toggleLinks()   { showLinks=!showLinks;     document.getElementById('lnkbtn').classList.toggle('on',showLinks); document.getElementById('lnkbtn').textContent=showLinks?'Links on':'Links off'; }

// Trails: trails[i][r] = array of {sx,sy,col,depth}
let trails = [];
function ensureTrails() {
  while(trails.length < N) trails.push({});
  for(let i=0;i<N;i++) for(let r=1;r<=5;r++) if(!trails[i][r]) trails[i][r]=[];
}

// Precompute face centroids for painter's sort
const fcent = FACES.map(f => {
  const x=VERTS[f[0]][0]+VERTS[f[1]][0]+VERTS[f[2]][0];
  const y=VERTS[f[0]][1]+VERTS[f[1]][1]+VERTS[f[2]][1];
  const z=VERTS[f[0]][2]+VERTS[f[1]][2]+VERTS[f[2]][2];
  return [x/3,y/3,z/3];
});

function drawSurface() {
  const pv = VERTS.map(v=>proj(v));
  const order = FACES.map((_,i)=>i).sort((a,b)=>{
    return (pv[FACES[a][0]][2]+pv[FACES[a][1]][2]+pv[FACES[a][2]][2])
          -(pv[FACES[b][0]][2]+pv[FACES[b][1]][2]+pv[FACES[b][2]][2]);
  });
  for(const fi of order) {
    const f = FACES[fi];
    const [p0,p1,p2] = [pv[f[0]],pv[f[1]],pv[f[2]]];
    const r = FRINGS[fi];
    const col = VIR[Math.min(r,VIR.length-1)];
    const avgZ = (p0[2]+p1[2]+p2[2])/3;
    const depth = Math.max(0,(avgZ+1.5)/3);
    ctx.beginPath();
    ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]);
    ctx.closePath();
    ctx.fillStyle = `rgba(${Math.round(col[0]*255)},${Math.round(col[1]*255)},${Math.round(col[2]*255)},${(0.38*depth).toFixed(3)})`;
    ctx.fill();
  }
}

function drawTracks() {
  for(let r=1;r<=5;r++) {
    const pts = TRACKS[r];
    const col = RCOLS[r];
    const pr  = pts.map(p=>proj(p));
    ctx.beginPath();
    pr.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.lineTo(pr[0][0],pr[0][1]);
    const rc=Math.round(col[0]*255),gc=Math.round(col[1]*255),bc=Math.round(col[2]*255);
    ctx.strokeStyle=`rgba(${rc},${gc},${bc},0.18)`;
    ctx.lineWidth=0.5; ctx.stroke();
  }
}

let lastT = null;

function draw(ts) {
  requestAnimationFrame(draw);
  const dt = lastT ? Math.min(ts-lastT, 50) : 16; lastT=ts;

  ctx.fillStyle = 'rgba(10,10,26,0.20)';
  ctx.fillRect(0,0,W,H);

  if(!paused) masterT += BASE_SPD * speedMult * dt;

  ensureTrails();

  // Draw surface
  if(showSurface) drawSurface();

  // Draw tracks
  if(showTracks) drawTracks();

  // For each racer i, compute positions on all 5 rings via linked t
  // and draw dots + trails + linking lines between rings
  for(let i=0; i<N; i++) {
    const baseT = ((masterT + i/N) % 1 + 1) % 1;

    // Compute t for each ring by chaining links
    const tByRing = {1: baseT};
    for(let r=1;r<=4;r++) tByRing[r+1] = linkedT(r, tByRing[r]);

    // Project positions
    const posByRing = {};
    for(let r=1;r<=5;r++) posByRing[r] = proj(interpTrack(r, tByRing[r]));

    // Draw link lines between consecutive rings
    if(showLinks) {
      for(let r=1;r<=4;r++) {
        const [x1,y1,z1] = posByRing[r];
        const [x2,y2,z2] = posByRing[r+1];
        const depth = Math.max(0,((z1+z2)/2+1.5)/3);
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
        ctx.strokeStyle = `rgba(255,255,255,${(0.25*depth).toFixed(3)})`;
        ctx.lineWidth = 0.8; ctx.stroke();
      }
    }

    // Draw dots and trails for each ring
    for(let r=1;r<=5;r++) {
      const [sx,sy,sz] = posByRing[r];
      const col = RCOLS[r];
      const depth = Math.max(0,(sz+1.5)/3);
      const rc=Math.round(col[0]*255),gc=Math.round(col[1]*255),bc=Math.round(col[2]*255);

      // Trail
      if(TRAIL_LEN > 0) {
        const trl = trails[i][r];
        trl.push({sx,sy,col:[rc,gc,bc],depth});
        if(trl.length > TRAIL_LEN) trl.shift();
        for(let j=1;j<trl.length;j++) {
          const a=trl[j-1],b=trl[j],fr=j/trl.length;
          ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy);
          ctx.strokeStyle=`rgba(${b.col[0]},${b.col[1]},${b.col[2]},${fr*0.5*depth})`;
          ctx.lineWidth=fr*2.5*depth; ctx.stroke();
        }
      }

      // Dot radius grows with ring number (outer rings smaller because more crowded)
      const radii = [0,7,5.5,4,3.5,2.8];
      const rad = radii[r] * depth;
      const g = ctx.createRadialGradient(sx,sy,0,sx,sy,rad*3);
      g.addColorStop(0,  `rgba(${rc},${gc},${bc},0.95)`);
      g.addColorStop(0.4,`rgba(${rc},${gc},${bc},0.2)`);
      g.addColorStop(1,  `rgba(${rc},${gc},${bc},0)`);
      ctx.beginPath(); ctx.arc(sx,sy,rad*3,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy,rad,0,Math.PI*2);
      ctx.fillStyle=`rgb(${rc},${gc},${bc})`; ctx.fill();
    }
  }
}

requestAnimationFrame(draw);
</script>
